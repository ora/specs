issue:
  impact: "Checks: `mpp-support` (`src/lib/scanner/layers/access.ts`) reads an operation's `x-payment-info` offers in `/openapi.json` as an MPP declaration in Ranker 3 (`declaresPaymentDiscoveryOffers`). The draft (draft-payment-discovery) is published on paymentauth.org, not the IETF datatracker, so its source folder in tempoxyz/mpp-specs is watched: an edit in place or a new revision both move the tree."
