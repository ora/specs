issue:
  title: "Personal Agent Protocol spec moved past the pinned sources - re-verify protocol-pap"
  impact: "The reviewed draft is 1.0, still in progress: the spec's authors ask builders to use it, and it takes only fixes, which can break compatibility. Drafts 0.1 to 0.4 are published and frozen, each graded by its own rules, and the latest published version is 0.4. The pins follow the spec repository rather than the rendered pages, whose banners change when a new draft starts. The tree of the reviewed draft's source folder (`content/versions/1.0`) moves with every edit to the in-progress draft, so each move means the text consumers teach changed. The blob of `content/versions/versions.json` moves when a draft is published or a new one starts. The working draft page digests (the unversioned `/docs/spec`, `/docs/guides`, `/docs/extensions`, `/docs/extensions/operations`, `/docs/extensions/browser-control` and `/docs/extensions/mediated-sign-in`) follow whatever draft those pages serve, Draft 1.0 as of 2026-11-13, and name the page that moved. Consumers grade and teach the reviewed state."
  todo: "For the moved 1.0 tree: diff the folder between the pin and the live tree (the changelog's draft 1.0 section lists each fix) and re-verify `skills/protocol-pap/`, then move the pin, and `reviewed.read` when a rule moved. For versions.json: read what moved; if Draft 1.0 was published, add its `published` date in `versions` and freeze the pin, and if a new draft started, add it to `versions` as `preview`, then move the versions.json pin. For a working draft digest: diff the old and new text with `node scripts/spec-drift.mjs page-text <page.html or URL>`, re-check the rules that page feeds, then move the digest; moving a pin alone records \"reviewed, nothing changed\"."
