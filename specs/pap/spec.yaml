issue:
  title: "Personal Agent Protocol spec moved past the pinned sources - re-verify protocol-pap"
  impact: "Ora pins the published Draft 0.3 and teaches it, grades Drafts 0.1 to 0.4 each by its own rules (0.4, still in progress, as a preview), and pins the spec repository rather than the rendered pages, whose banners change when a new draft starts. The tree of the pinned draft's source folder (`content/versions/0.3`) moves only if someone edits a published draft, which should never happen. The blob of `content/versions/versions.json` moves when a draft is published or a new one starts. The working draft page digests (the unversioned `/docs/spec`, `/docs/guides`, `/docs/extensions`, `/docs/extensions/operations`, `/docs/extensions/browser-control` and `/docs/extensions/mediated-sign-in`, every page that feeds a graded 0.4 preview rule) follow whatever draft those pages serve, Draft 0.4 as of 2026-11-09, so they are how churn in the 0.4 preview rules is noticed, page by page (the in-progress `content/versions/0.4` folder is not pinned: one tree SHA would only say that something in the draft moved). Our pap-* checks, catalog, and recommendation copy grade and teach the reviewed state, and the draft says any part can change incompatibly."
  todo: "For the moved 0.3 tree: diff the folder between the pin and the live tree and re-verify `skills/protocol-pap/`, then move that pin. For versions.json: read what moved; if Draft 0.4 was published, decide with the product owner whether to adopt it (`reviewed.version`, the tree source's path and pin, `versions`), and if a new draft started, add it to `versions` as `preview`, then move the versions.json pin. For a working draft digest: diff the old and new text with `node scripts/spec-drift.mjs page-text <page.html or URL>`, re-check the preview rules against it, then move the digest; moving a pin alone records \"reviewed, nothing changed\"."
